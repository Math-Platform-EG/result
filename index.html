<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مدرس في بيتك</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Supabase JS v2: تمت إضافة المكتبة فقط بدون تغيير التصميم أو نظام الموقع الحالي -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Cairo", sans-serif;
        }

        :root {
            --primary: #4f46e5;
            --secondary: #7c3aed;
            --background: #080b1c;
            --card: #111827;
            --input: #0f172a;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            color: var(--text);
            background:
                linear-gradient(
                    135deg,
                    #080b1c 0%,
                    #0d1328 50%,
                    #15113a 100%
                );
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .background-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                );
            background-size: 60px 60px;
            z-index: 0;
        }

        .light {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .light-one {
            width: 420px;
            height: 420px;
            top: -220px;
            right: -150px;
            background:
                radial-gradient(
                    circle,
                    rgba(79,70,229,.22),
                    transparent 70%
                );
        }

        .light-two {
            width: 420px;
            height: 420px;
            bottom: -240px;
            left: -150px;
            background:
                radial-gradient(
                    circle,
                    rgba(124,58,237,.20),
                    transparent 70%
                );
        }

        /* =========================
           الصفحات
        ========================= */

        .page {
            display: none;
            width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .page.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           زر الأدمن
        ========================= */

        .admin-button {
            position: fixed;
            top: 22px;
            left: 22px;
            width: 70px;
            height: 70px;
            border: 1px solid #29354a;
            border-radius: 18px;
            background: #111827;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 8px 25px rgba(0,0,0,.25);
            transition: transform .15s ease, border-color .15s ease;
        }

        .admin-button:hover {
            transform: translateY(-3px);
            border-color: #6366f1;
        }

        .admin-button i {
            font-size: 20px;
            color: #a5b4fc;
        }

        .admin-button span {
            font-size: 11px;
            font-weight: 700;
        }

        /* =========================
           زر الرجوع
        ========================= */

        .back-top-button {
            position: fixed;
            top: 22px;
            right: 22px;
            min-width: 125px;
            height: 48px;
            padding: 0 18px;
            border: 1px solid #29354a;
            border-radius: 14px;
            background: #111827;
            color: #e2e8f0;
            cursor: pointer;
            z-index: 100;
            font-size: 13px;
            font-weight: 700;
            transition: transform .15s ease, border-color .15s ease;
        }

        .back-top-button:hover {
            transform: translateY(-2px);
            border-color: #6366f1;
        }

        .back-top-button i {
            margin-left: 6px;
            color: #a5b4fc;
        }

        /* =========================
           الكروت
        ========================= */

        .login-container,
        .admin-card {
            width: calc(100% - 30px);
            max-width: 450px;
            padding: 38px 36px 30px;
            position: relative;
            z-index: 10;
            background: #111827;
            border: 1px solid #263247;
            border-radius: 26px;
            box-shadow: 0 25px 65px rgba(0,0,0,.38);
        }

        .admin-card {
            max-width: 500px;
        }

        .login-container::before,
        .admin-card::before,
        .student-dashboard::before {
            content: "";
            position: absolute;
            top: 0;
            right: 18%;
            left: 18%;
            height: 1px;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #6366f1,
                    transparent
                );
        }

        /* =========================
           الأيقونات
        ========================= */

        .logo,
        .icon-box {
            width: 78px;
            height: 78px;
            margin: 0 auto 18px;
            border-radius: 21px;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );
            box-shadow: 0 8px 24px rgba(79,70,229,.30);
        }

        .logo i,
        .icon-box i {
            font-size: 32px;
            color: white;
        }

        /* =========================
           العناوين
        ========================= */

        .site-name,
        .admin-title {
            text-align: center;
            color: white;
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 2px;
        }

        .teacher-name,
        .subtitle {
            text-align: center;
            color: #a5b4fc;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 28px;
        }

        /* =========================
           الحقول
        ========================= */

        .form-group {
            margin-bottom: 17px;
        }

        label:not(.file-box) {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper > i {
            position: absolute;
            top: 50%;
            right: 18px;
            transform: translateY(-50%);
            color: #818cf8;
            font-size: 16px;
            pointer-events: none;
            z-index: 2;
        }

        select,
        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 52px;
            border: 1px solid #334155;
            border-radius: 12px;
            outline: none;
            background: #0f172a;
            color: #f8fafc;
            padding: 0 48px 0 18px;
            font-size: 14px;
            transition: border-color .15s ease, background .15s ease;
        }

        select:focus,
        input:focus {
            border-color: #6366f1;
            background: #121c31;
        }

        input::placeholder {
            color: #64748b;
        }

        select {
            appearance: none;
            cursor: pointer;
        }

        select option {
            background: #111827;
            color: white;
        }

        .select-arrow {
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            color: #94a3b8;
            pointer-events: none;
        }

        /* =========================
           الأزرار
        ========================= */

        .login-button,
        .button {
            width: 100%;
            height: 55px;
            margin-top: 7px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            color: white;
            font-size: 16px;
            font-weight: 800;
            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );
            box-shadow: 0 10px 25px rgba(79,70,229,.25);
            transition: transform .15s ease, opacity .15s ease;
        }

        .login-button:hover,
        .button:hover {
            transform: translateY(-2px);
            opacity: .96;
        }

        .login-button:active,
        .button:active {
            transform: scale(.98);
        }

        .login-button:disabled,
        .button:disabled {
            opacity: .7;
            cursor: not-allowed;
            transform: none;
        }

        .save-button {
            background:
                linear-gradient(
                    135deg,
                    #059669,
                    #16a34a
                );
            box-shadow: 0 10px 25px rgba(22,163,74,.20);
        }

        /* =========================
           الرسائل
        ========================= */

        .message {
            display: none;
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
        }

        .message.error {
            display: block;
            color: #fecaca;
            background: rgba(239,68,68,.10);
            border: 1px solid rgba(239,68,68,.25);
        }

        .message.success {
            display: block;
            color: #86efac;
            background: rgba(34,197,94,.10);
            border: 1px solid rgba(34,197,94,.25);
        }

        .message.loading {
            display: block;
            color: #c7d2fe;
            background: rgba(79,70,229,.10);
            border: 1px solid rgba(99,102,241,.25);
        }

        .footer-text {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 11px;
        }

        /* =========================
           اختيار الملف
        ========================= */

        .file-box {
            width: 100%;
            min-height: 150px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 1px dashed #475569;
            border-radius: 18px;
            background: #0f172a;
            cursor: pointer;
            transition: border-color .15s ease, background .15s ease;
        }

        .file-box:hover {
            border-color: #6366f1;
            background: #121c31;
        }

        .file-box i {
            color: #818cf8;
            font-size: 35px;
            margin-bottom: 12px;
        }

        .file-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .file-help {
            color: #94a3b8;
            font-size: 11px;
        }

        #excelFile {
            display: none;
        }

        .selected-file {
            display: none;
            margin-top: 14px;
            padding: 13px 15px;
            border-radius: 12px;
            background: rgba(79,70,229,.10);
            border: 1px solid rgba(99,102,241,.25);
            color: #c7d2fe;
            font-size: 12px;
            word-break: break-word;
        }

        .selected-file.show {
            display: block;
        }

        .current-file {
            margin-top: 20px;
            padding: 15px;
            border-radius: 14px;
            background: #0f172a;
            border: 1px solid #263247;
        }

        .current-file-title {
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 700;
        }

        #currentFileName {
            color: #94a3b8;
            font-size: 12px;
            word-break: break-word;
        }

        .logout-button {
            width: 100%;
            margin-top: 15px;
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            font-size: 12px;
        }

        .logout-button:hover {
            color: white;
        }

        /* =========================
           واجهة الطالب
        ========================= */

        .student-page-content {
            width: 100%;
            max-width: 1050px;
            padding: 90px 15px 35px;
            position: relative;
            z-index: 10;
        }

        .student-dashboard {
            position: relative;
            width: 100%;
            background: #111827;
            border: 1px solid #263247;
            border-radius: 26px;
            padding: 30px;
            box-shadow: 0 25px 65px rgba(0,0,0,.38);
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding-bottom: 25px;
            margin-bottom: 25px;
            border-bottom: 1px solid #263247;
        }

        .student-info-main {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .student-avatar {
            width: 65px;
            height: 65px;
            flex-shrink: 0;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );
            box-shadow: 0 8px 24px rgba(79,70,229,.25);
        }

        .student-avatar i {
            font-size: 27px;
            color: white;
        }

        .student-welcome {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 3px;
        }

        .student-name {
            color: white;
            font-size: 23px;
            font-weight: 900;
        }

        .student-grade-badge {
            padding: 9px 16px;
            border-radius: 12px;
            color: #c7d2fe;
            background: rgba(79,70,229,.12);
            border: 1px solid rgba(99,102,241,.25);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .data-title {
            margin-bottom: 18px;
            color: #e2e8f0;
            font-size: 17px;
            font-weight: 800;
        }

        .data-title i {
            color: #818cf8;
            margin-left: 6px;
        }

        .student-data-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .data-item {
            min-height: 105px;
            padding: 16px;
            border-radius: 16px;
            background: #0f172a;
            border: 1px solid #263247;
            transition: transform .15s ease, border-color .15s ease;
        }

        .data-item:hover {
            transform: translateY(-3px);
            border-color: #475569;
        }

        .data-label {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .data-value {
            color: #f8fafc;
            font-size: 19px;
            font-weight: 900;
            word-break: break-word;
        }

        .student-empty {
            grid-column: 1 / -1;
            padding: 30px;
            text-align: center;
            border-radius: 18px;
            background: #0f172a;
            border: 1px solid #263247;
            color: #94a3b8;
        }

        /* =========================
           دوائر الدرجات الملونة
        ========================= */

        .grade-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 900;
            border: 2px solid;
        }

        .grade-red {
            color: #f87171;
            border-color: #ef4444;
            background: rgba(239,68,68,.12);
        }

        .grade-yellow {
            color: #facc15;
            border-color: #eab308;
            background: rgba(234,179,8,.12);
        }

        .grade-blue {
            color: #4ade80;
            border-color: #22c55e;
            background: rgba(34,197,94,.12);
        }

        .grade-green {
            color: #60a5fa;
            border-color: #3b82f6;
            background: rgba(59,130,246,.12);
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 700px) {

            .login-container,
            .admin-card {
                padding: 34px 22px 28px;
                border-radius: 23px;
            }

            .site-name,
            .admin-title {
                font-size: 25px;
            }

            .admin-button {
                top: 15px;
                left: 15px;
                width: 64px;
                height: 64px;
            }

            .back-top-button {
                top: 15px;
                right: 15px;
                min-width: auto;
                height: 42px;
                padding: 0 13px;
                font-size: 11px;
            }

            .student-page-content {
                padding-top: 75px;
            }

            .student-dashboard {
                padding: 22px 15px;
            }

            .student-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .student-grade-badge {
                align-self: stretch;
                text-align: center;
            }

            .student-name {
                font-size: 19px;
            }

            .student-data-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .data-item {
                min-height: 90px;
                padding: 13px;
            }

            .data-value {
                font-size: 16px;
            }

        }

        @media (max-width: 390px) {

            .student-data-grid {
                grid-template-columns: 1fr;
            }

        }


        /* =========================
           شعار AH واضح واحترافي
        ========================= */
        .ah-logo {
            position: fixed;
            right: 24px;
            bottom: 22px;
            width: 86px;
            height: 86px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            direction: ltr;
            border-radius: 22px;
            z-index: 9999;
            pointer-events: none;
            background: linear-gradient(145deg, #111827, #172554);
            border: 1px solid rgba(129,140,248,.7);
            box-shadow: 0 14px 35px rgba(0,0,0,.42), 0 0 24px rgba(79,70,229,.16);
        }
        .ah-logo::before {
            content: "";
            position: absolute;
            inset: 7px;
            border-radius: 17px;
            border: 1px solid rgba(255,255,255,.08);
        }
        .ah-logo .logo-a,
        .ah-logo .logo-h {
            position: relative;
            font-family: Arial Black, Arial, sans-serif;
            font-size: 48px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -6px;
            color: #ffffff;
            text-shadow: 0 3px 12px rgba(0,0,0,.35);
            z-index: 2;
        }
        .ah-logo .logo-a {
            transform: translateX(4px);
        }
        .ah-logo .logo-h {
            color: #a5b4fc;
            transform: translateX(-4px);
        }
        .ah-logo .logo-line {
            position: absolute;
            width: 48px;
            height: 3px;
            bottom: 13px;
            border-radius: 99px;
            background: #818cf8;
            box-shadow: 0 0 12px rgba(129,140,248,.8);
        }
        @media (max-width: 600px) {
            .ah-logo { right: 14px; bottom: 14px; width: 68px; height: 68px; border-radius: 18px; }
            .ah-logo::before { inset: 6px; border-radius: 13px; }
            .ah-logo .logo-a, .ah-logo .logo-h { font-size: 38px; letter-spacing: -5px; }
            .ah-logo .logo-a { transform: translateX(3px); }
            .ah-logo .logo-h { transform: translateX(-3px); }
            .ah-logo .logo-line { width: 38px; bottom: 9px; }
        }

        /* =========================
           شعار OM - أسفل اليسار
        ========================= */
        .om-logo {
            position: fixed;
            left: 24px;
            bottom: 22px;
            width: 86px;
            height: 86px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            direction: ltr;
            border-radius: 22px;
            z-index: 9999;
            pointer-events: none;
            background: linear-gradient(145deg, #111827, #172554);
            border: 1px solid rgba(129,140,248,.7);
            box-shadow: 0 14px 35px rgba(0,0,0,.42), 0 0 24px rgba(79,70,229,.16);
        }
        .om-logo::before {
            content: "";
            position: absolute;
            inset: 7px;
            border-radius: 17px;
            border: 1px solid rgba(255,255,255,.08);
        }
        .om-logo .logo-o,
        .om-logo .logo-m {
            position: relative;
            font-family: Arial Black, Arial, sans-serif;
            font-size: 46px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -7px;
            color: #ffffff;
            text-shadow: 0 3px 12px rgba(0,0,0,.35);
            z-index: 2;
        }
        .om-logo .logo-o {
            transform: translateX(4px);
        }
        .om-logo .logo-m {
            color: #a5b4fc;
            transform: translateX(-4px);
        }
        .om-logo .logo-line {
            position: absolute;
            width: 48px;
            height: 3px;
            bottom: 13px;
            border-radius: 99px;
            background: #818cf8;
            box-shadow: 0 0 12px rgba(129,140,248,.8);
        }
        @media (max-width: 600px) {
            .om-logo { left: 14px; bottom: 14px; width: 68px; height: 68px; border-radius: 18px; }
            .om-logo::before { inset: 6px; border-radius: 13px; }
            .om-logo .logo-o, .om-logo .logo-m { font-size: 36px; letter-spacing: -5px; }
            .om-logo .logo-o { transform: translateX(3px); }
            .om-logo .logo-m { transform: translateX(-3px); }
            .om-logo .logo-line { width: 38px; bottom: 9px; }
        }

    </style>
</head>

<body>

    <div class="background-grid"></div>
    <div class="light light-one"></div>
    <div class="light light-two"></div>

    <!-- صفحة تسجيل دخول الطالب -->
    <section class="page active" id="studentPage">

        <button type="button" class="admin-button" id="adminButton">
            <i class="fa-solid fa-user-tie"></i>
            <span>أدمن</span>
        </button>

        <main class="login-container">

            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <h1 class="site-name">مدرس في بيتك</h1>

            <p class="teacher-name">م/محمد حامد</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="grade">الصف الدراسي</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-school"></i>

                        <select id="grade">
                            <option value="">اختر الصف الدراسي</option>
                            <option value="first">الصف الأول الإعدادي</option>
                            <option value="second">الصف الثاني الإعدادي</option>
                            <option value="third">الصف الثالث الإعدادي</option>
                        </select>

                        <span class="select-arrow">
                            <i class="fa-solid fa-chevron-down"></i>
                        </span>

                    </div>
                </div>

                <div class="form-group">

                    <label for="studentCode">كود الطالب</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-key"></i>

                        <input
                            type="text"
                            id="studentCode"
                            placeholder="اكتب الكود الخاص بك"
                            autocomplete="off"
                        >

                    </div>

                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="studentLoginButton"
                >
                    <i class="fa-solid fa-right-to-bracket"></i>
                    تسجيل الدخول

                <div id="studentMessage" class="message"></div>

            </form>

            <p class="footer-text">
                جميع الحقوق محفوظة © مدرس في بيتك
            </p>

        </main>

    </section>

    <!-- صفحة دخول الأدمن -->
    <section class="page" id="adminLoginPage">

        <button
            type="button"
            class="back-top-button"
            id="backFromAdminLogin"
        >
            <i class="fa-solid fa-arrow-right"></i>
            رجوع للرئيسية
        </button>

        <main class="admin-card">

            <div class="icon-box">
                <i class="fa-solid fa-user-shield"></i>
            </div>

            <h1 class="admin-title">لوحة الإدارة</h1>

            <p class="subtitle">
                قم بإدخال كلمة المرور للمتابعة
            </p>

            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="adminPassword">
                        كلمة مرور الأدمن
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="اكتب كلمة المرور"
                        >

                    </div>

                </div>

                <button type="submit" class="button">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    دخول لوحة الإدارة
                </button>

                <div id="adminMessage" class="message"></div>

            </form>

        </main>

    </section>

    <!-- صفحة رفع ملف Excel -->
    <section class="page" id="adminUploadPage">

        <button
            type="button"
            class="back-top-button"
            id="backFromUpload"
        >
            <i class="fa-solid fa-arrow-right"></i>
            رجوع للرئيسية
        </button>

        <main class="admin-card">

            <div class="icon-box">
                <i class="fa-solid fa-file-excel"></i>
            </div>

            <h1 class="admin-title">
                تحديث ملف الدرجات
            </h1>

            <p class="subtitle">
                اختر ملف Excel الجديد ثم اضغط حفظ
            </p>

            <label for="excelFile" class="file-box">

                <i class="fa-solid fa-cloud-arrow-up"></i>

                <div class="file-title">
                    اختر ملف Excel
                </div>

                <div class="file-help">
                    الملفات المدعومة: XLSX / XLS
                </div>

            </label>

            <input
                type="file"

                accept=".xlsx,.xls"
            >

            <div class="selected-file" id="selectedFile">
                <i class="fa-solid fa-file-excel"></i>
                <span id="selectedFileName"></span>
            </div>

            <button
                type="button"
                class="button save-button"
                id="saveFileButton"
                style="margin-top:18px;"
            >
                <i class="fa-solid fa-floppy-disk"></i>
                حفظ وتحديث الملف
            </button>

            <div id="fileMessage" class="message"></div>

            <div class="current-file">

                <div class="current-file-title">
                    <i class="fa-solid fa-circle-check"></i>
                    الملف الحالي المستخدم
                </div>

                <div id="currentFileName">
                    جاري التحقق...
                </div>

            </div>

            <button
                type="button"
                class="logout-button"
                id="logoutButton"
            >
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                تسجيل الخروج
            </button>

        </main>

    </section>

    <!-- واجهة بيانات الطالب -->
    <section class="page" id="studentDashboardPage">

        <button
            type="button"
            class="back-top-button"
            id="backFromStudentDashboard"
        >
            <i class="fa-solid fa-arrow-right"></i>
            تسجيل الخروج
        </button>

        <div class="student-page-content">

            <main class="student-dashboard">

                <div class="student-header">

                    <div class="student-info-main">

                        <div class="student-avatar">
                            <i class="fa-solid fa-user-graduate"></i>
                        </div>

                        <div>

                            <div class="student-welcome">
                                مرحبًا بك
                            </div>

                            <div
                                class="student-name"
                                id="dashboardStudentName"
                            >
                                الطالب
                            </div>

                        </div>

                    </div>

                    <div
                        class="student-grade-badge"
                        id="dashboardStudentGrade"
                    >
                        الصف الدراسي
                    </div>

                </div>

                <h2 class="data-title">
                    <i class="fa-solid fa-chart-column"></i>
                    بياناتك ودرجاتك
                </h2>

                <div
                    class="student-data-grid"
                    id="studentDataGrid"
                ></div>

            </main>

        </div>

    </section>

    <script>

        /* =====================================
           Supabase Configuration
           ضع رابط مشروعك و Publishable Key هنا عند الربط الفعلي.
           تمت إضافة المكتبة والعميل بدون تغيير التخزين الحالي أو التصميم.
        ===================================== */
        const SUPABASE_URL = "https://chgysnmeiajcdakqdtpx.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Rc3MJ9DUoj_6RaTnZSyRCg_pSuSBwTi";

        const supabaseClient =
            SUPABASE_URL.startsWith("http") &&
            !SUPABASE_ANON_KEY.includes("PUT_YOUR")
                ? window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_ANON_KEY
                  )
                : null;

        const studentPage =
            document.getElementById("studentPage");

        const adminLoginPage =
            document.getElementById("adminLoginPage");

        const adminUploadPage =
            document.getElementById("adminUploadPage");

        const studentDashboardPage =
            document.getElementById("studentDashboardPage");

        const adminButton =
            document.getElementById("adminButton");

        const backFromAdminLogin =
            document.getElementById("backFromAdminLogin");

        const backFromUpload =
            document.getElementById("backFromUpload");

        const backFromStudentDashboard =
            document.getElementById("backFromStudentDashboard");

        const loginForm =
            document.getElementById("loginForm");

        const grade =
            document.getElementById("grade");

        const studentCode =
            document.getElementById("studentCode");

        const studentMessage =
            document.getElementById("studentMessage");

        const studentLoginButton =
            document.getElementById("studentLoginButton");

        const adminLoginForm =
            document.getElementById("adminLoginForm");

        const adminPassword =
            document.getElementById("adminPassword");

        const adminMessage =
            document.getElementById("adminMessage");

        const excelFile =
            document.getElementById("excelFile");

        const selectedFile =
            document.getElementById("selectedFile");

        const selectedFileName =
            document.getElementById("selectedFileName");

        const saveFileButton =
            document.getElementById("saveFileButton");

        const fileMessage =
            document.getElementById("fileMessage");

        const currentFileName =
            document.getElementById("currentFileName");

        const logoutButton =
            document.getElementById("logoutButton");

        const dashboardStudentName =
            document.getElementById("dashboardStudentName");

        const dashboardStudentGrade =
            document.getElementById("dashboardStudentGrade");

        const studentDataGrid =
            document.getElementById("studentDataGrid");


        /* أسماء الصفوف والشيتات */

        const gradeInfo = {

            first: {
                sheet: "1ع",
                name: "الصف الأول الإعدادي"
            },

            second: {
                sheet: "2ع",
                name: "الصف الثاني الإعدادي"
            },

            third: {
                sheet: "3ع",
                name: "الصف الثالث الإعدادي"
            }

        };


        /* تغيير الصفحة */

        function showPage(page) {

            document
                .querySelectorAll(".page")
                .forEach(function(item) {

                    item.classList.remove("active");

                });

            page.classList.add("active");

            window.scrollTo({
                top: 0,
                behavior: "auto"
            });

        }


        /* الرسائل */

        function showMessage(element, text, type) {

            element.textContent = text;
            element.className = "message " + type;

        }


        function hideMessage(element) {

            element.textContent = "";
            element.className = "message";

        }


        /* فتح الأدمن */

        adminButton.addEventListener(
            "click",
            function() {

                showPage(adminLoginPage);

                hideMessage(adminMessage);

                adminPassword.value = "";

                setTimeout(function() {
                    adminPassword.focus();
                }, 50);

            }
        );


        /* الرجوع من الأدمن */

        backFromAdminLogin.addEventListener(
            "click",
            function() {

                showPage(studentPage);

                adminPassword.value = "";

                hideMessage(adminMessage);

            }
        );


        /* الرجوع من رفع الملف */

        backFromUpload.addEventListener(
            "click",
            function() {

                showPage(studentPage);

                excelFile.value = "";

                selectedFile.classList.remove("show");

                hideMessage(fileMessage);

            }
        );


        /* خروج الطالب */

        backFromStudentDashboard.addEventListener(
            "click",
            function() {

                showPage(studentPage);

                studentCode.value = "";

                studentDataGrid.innerHTML = "";

                hideMessage(studentMessage);

            }
        );


        /* Supabase Storage للملف الحالي */

        const SUPABASE_EXCEL_TABLE = "teacher_excel_files";
        const SUPABASE_EXCEL_ID = "currentExcelFile";

        function dataUrlToBlob(dataUrl, type) {
            const base64 = String(dataUrl || "").split(",").pop();
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new Blob([bytes], { type: type || "application/octet-stream" });
        }

        async function getCurrentExcelFile() {
            if (!supabaseClient) throw new Error("Supabase غير جاهز");
            const { data, error } = await supabaseClient
                .from(SUPABASE_EXCEL_TABLE)
                .select("file_name,file_data,updated_at")
                .eq("id", SUPABASE_EXCEL_ID)
                .maybeSingle();
            if (error) throw error;
            if (!data || !data.file_data || data.file_data === "EMPTY") return null;
            return {
                file: dataUrlToBlob(data.file_data, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"),
                name: data.file_name || "grades.xlsx",
                updatedAt: data.updated_at || ""
            };
        }

        async function showCurrentFile() {
            if (!supabaseClient) {
                currentFileName.textContent = "تعذر الاتصال بـ Supabase.";
                return;
            }
            try {
                const savedData = await getCurrentExcelFile();
                currentFileName.textContent = savedData ? savedData.name : "لا يوجد ملف محفوظ حاليًا.";
            } catch (error) {
                console.error(error);
                currentFileName.textContent = "تعذر قراءة الملف الحالي.";
            }
        }

        showCurrentFile();


        /* تسجيل دخول الطالب */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                hideMessage(studentMessage);


                if (grade.value === "") {

                    showMessage(
                        studentMessage,
                        "من فضلك اختر الصف الدراسي أولاً.",
                        "error"
                    );

                    return;

                }


                if (
                    studentCode.value.trim() === ""
                ) {

                    showMessage(
                        studentMessage,
                        "من فضلك اكتب كود الطالب.",
                        "error"
                    );

                    return;

                }


                studentLoginButton.disabled = true;

                studentLoginButton.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin"></i> جاري البحث...';


                showMessage(
                    studentMessage,
                    "جاري قراءة بياناتك...",
                    "loading"
                );


                try {

                    const savedFileData =
                        await getCurrentExcelFile();


                    if (!savedFileData) {

                        showMessage(
                            studentMessage,
                            "لا يوجد ملف درجات مرفوع حاليًا.",
                            "error"
                        );

                        return;

                    }


                    const arrayBuffer =
                        await savedFileData.file.arrayBuffer();


                    const workbook =
                        XLSX.read(
                            arrayBuffer,
                            {
                                type: "array"
                            }
                        );


                    const selectedGradeInfo =
                        gradeInfo[grade.value];


                    const sheet =
                        workbook.Sheets[
                            selectedGradeInfo.sheet
                        ];


                    if (!sheet) {

                        showMessage(
                            studentMessage,
                            "لم يتم العثور على بيانات هذا الصف داخل الملف.",
                            "error"
                        );

                        return;

                    }


                    const rows =
                        XLSX.utils.sheet_to_json(
                            sheet,
                            {
                                defval: ""
                            }
                        );


                    const enteredCode =
                        String(
                            studentCode.value
                        ).trim();


                    const student =
                        rows.find(
                            function(row) {

                                const excelCode =
                                    row["الكود"] ??
                                    row["كود"] ??
                                    row["كود الطالب"] ??
                                    row["CODE"] ??
                                    row["Code"] ??
                                    row["code"];


                                return (
                                    excelCode !== undefined &&
                                    excelCode !== null &&
                                    String(excelCode).trim()
                                    === enteredCode
                                );

                            }
                        );


                    if (!student) {

                        showMessage(
                            studentMessage,
                            "الكود غير موجود في هذا الصف الدراسي.",
                            "error"
                        );

                        return;

                    }


                    showStudentData(
                        student,
                        selectedGradeInfo.name
                    );


                    hideMessage(studentMessage);


                    showPage(
                        studentDashboardPage
                    );

                }

                catch (error) {

                    console.error(error);

                    showMessage(
                        studentMessage,
                        "حدث خطأ أثناء قراءة ملف الدرجات.",
                        "error"
                    );

                }

                finally {

                    studentLoginButton.disabled = false;

                    studentLoginButton.innerHTML =
                        '<i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول';

                }

            }
        );


        /* =====================================
           عرض بيانات الطالب

           التعديل الجديد:
           الألوان تبدأ من أول عمود اسمه "اختبار"
           وما بعده فقط
        ===================================== */

        function showStudentData(
            student,
            gradeName
        ) {

            const studentName =
                student["الاسم"] ??
                student["اسم الطالب"] ??
                student["اسم"] ??
                "الطالب";


            dashboardStudentName.textContent =
                studentName;


            dashboardStudentGrade.textContent =
                gradeName;


            studentDataGrid.innerHTML = "";


            const keys =
                Object.keys(student);


            if (keys.length === 0) {

                studentDataGrid.innerHTML =
                    `
                    <div class="student-empty">
                        لا توجد بيانات متاحة لهذا الطالب.
                    </div>
                    `;

                return;

            }


            /*
               البحث عن أول عمود يحتوي على كلمة اختبار
               مثال:
               اختبار
               اختبار 1
               اختبار أول
               اختبار شهري
            */

            const examStartIndex =
                keys.findIndex(function(key) {

                    return String(key)
                        .trim()
                        .includes("اختبار");

                });


            keys.forEach(
                function(key, index) {

                    let value = student[key];


                    if (
                        value === "" ||
                        value === null ||
                        value === undefined
                    ) {

                        value = "-";

                    }


                    const item =
                        document.createElement("div");

                    item.className = "data-item";


                    const label =
                        document.createElement("div");

                    label.className = "data-label";

                    label.textContent = key;


                    const dataValue =
                        document.createElement("div");

                    dataValue.className = "data-value";


                    const numericValue =
                        Number(
                            String(value)
                            .replace(",", ".")
                            .trim()
                        );


                    /*
                       الدرجة يتم تلوينها فقط إذا:

                       1- العمود هو "اختبار"
                          أو موجود بعده.

                       2- القيمة رقم من 0 إلى 10.
                    */

                    const isGradeColumn =
                        examStartIndex !== -1 &&
                        index >= examStartIndex;


                    if (
                        isGradeColumn &&
                        value !== "-" &&
                        !isNaN(numericValue) &&
                        numericValue >= 0 &&
                        numericValue <= 10
                    ) {

                        const gradeCircle =
                            document.createElement("div");

                        gradeCircle.className =
                            "grade-circle";


                        /*
                           أقل من 5 = أحمر
                        */

                        if (numericValue < 5) {

                            gradeCircle.classList.add(
                                "grade-red"
                            );

                        }


                        /*
                           5 بالضبط = أصفر
                        */

                        else if (numericValue === 5) {

                            gradeCircle.classList.add(
                                "grade-yellow"
                            );

                        }


                        /*
                           أكبر من 5 وأقل من 10 = أخضر
                        */

                        else if (
                            numericValue > 5 &&
                            numericValue < 10
                        ) {

                            gradeCircle.classList.add(
                                "grade-green"
                            );

                        }


                        /*
                           10 بالضبط = أزرق
                        */

                        else if (numericValue === 10) {

                            gradeCircle.classList.add(
                                "grade-blue"
                            );

                        }


                        gradeCircle.textContent =
                            String(value);


                        dataValue.appendChild(
                            gradeCircle
                        );

                    }

                    else {

                        /*
                           الاسم والكود والغياب والإذن
                           وأي بيانات قبل الاختبار
                           تظهر عادية
                        */

                        dataValue.textContent =
                            String(value);

                    }


                    item.appendChild(label);

                    item.appendChild(dataValue);

                    studentDataGrid.appendChild(item);

                }
            );

        }


        /* دخول الأدمن */

        adminLoginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                hideMessage(adminMessage);


                if (
                    adminPassword.value === "admin"
                ) {

                    adminPassword.value = "";

                    showPage(adminUploadPage);

                    showCurrentFile();

                }

                else {

                    showMessage(
                        adminMessage,
                        "كلمة المرور غير صحيحة.",
                        "error"
                    );

                    adminPassword.value = "";

                    adminPassword.focus();

                }

            }
        );


        /* اختيار ملف Excel */

        excelFile.addEventListener(
            "change",
            function() {

                const file =
                    excelFile.files[0];


                if (!file) {
                    return;
                }


                const fileName =
                    file.name.toLowerCase();


                if (
                    !fileName.endsWith(".xlsx") &&
                    !fileName.endsWith(".xls")
                ) {

                    showMessage(
                        fileMessage,
                        "اختر ملف Excel بصيغة XLSX أو XLS.",
                        "error"
                    );

                    excelFile.value = "";

                    selectedFile.classList.remove("show");

                    return;

                }


                hideMessage(fileMessage);

                selectedFileName.textContent =
                    file.name;

                selectedFile.classList.add("show");

            }
        );


        /* حفظ الملف واستبدال القديم */

        saveFileButton.addEventListener(
            "click",
            async function() {
                const file = excelFile.files[0];
                if (!file) {
                    showMessage(fileMessage, "من فضلك اختر ملف Excel أولاً.", "error");
                    return;
                }
                if (!supabaseClient) {
                    showMessage(fileMessage, "Supabase غير متصل.", "error");
                    return;
                }
                saveFileButton.disabled = true;
                saveFileButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';
                try {
                    const base64 = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = () => reject(reader.error);
                        reader.readAsDataURL(file);
                    });
                    const { error } = await supabaseClient
                        .from(SUPABASE_EXCEL_TABLE)
                        .upsert({
                            id: SUPABASE_EXCEL_ID,
                            file_name: file.name,
                            file_data: base64,
                            updated_at: new Date().toISOString()
                        });
                    if (error) throw error;
                    showMessage(fileMessage, "تم حفظ وتحديث ملف الدرجات بنجاح ✓", "success");
                    currentFileName.textContent = file.name;
                    excelFile.value = "";
                    selectedFile.classList.remove("show");
                } catch (error) {
                    console.error(error);
                    showMessage(fileMessage, "حدث خطأ أثناء حفظ الملف على Supabase.", "error");
                } finally {
                    saveFileButton.disabled = false;
                    saveFileButton.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> حفظ وتحديث الملف';
                }
            }
        );


        /* تسجيل خروج الأدمن */

        logoutButton.addEventListener(
            "click",
            function() {

                showPage(studentPage);

                adminPassword.value = "";

                hideMessage(adminMessage);

                hideMessage(fileMessage);

                excelFile.value = "";

                selectedFile.classList.remove("show");

            }
        );

    </script>

        <span class="logo-line"></span>
